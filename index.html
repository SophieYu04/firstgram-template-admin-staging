<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Staging · Firstgram 官方模板管理</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span>FIRSTGRAM / OPERATIONS</span><h1>官方模板</h1><p>人物與桌面各六張。發布前先預覽；新版本完整下載後才會替換手機上的舊版本。</p></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>管理員登入</h2><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button>登入</button></form>
<form id="mfa-form" hidden><p id="enroll-note"></p><img id="qr" alt="驗證器設定 QR Code" hidden><label>驗證器六位數代碼<input id="otp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button>驗證</button></form></section>
<div id="workspace" hidden><div class="toolbar"><strong id="environment"></strong><button id="refresh" type="button">重新整理</button><button id="signout" type="button">登出</button></div>
<section><h2>準備新版本</h2><form id="upload-form"><label>分類<select id="category"><option value="pose">人物</option><option value="table">桌面</option></select></label><label>六張圖片<input id="images" type="file" accept="image/*" multiple required></label><p>自動轉成 JPEG，最長邊 2048px，每組不得超過 10 MB。請確認裁切、人物與使用權。</p><div id="preview" class="grid"></div><label>授權紀錄<textarea id="rights" maxlength="4000" required placeholder="素材來源、授權範圍、人物同意與證明位置"></textarea></label><label>封面<select id="cover"></select></label><button>儲存草稿</button></form></section>
<section><h2>發布與預約</h2><p>時間皆以 Asia/Taipei 顯示。伺服器發布時間與手機實際完成下載時間不同。</p><div id="releases"></div></section>
<section><h2>更新狀態</h2><p>Apple 接受推播不代表手機已下載；未回報裝置的完成狀態未知。下載位元組為回報估算，不是 CDN 帳單。</p><pre id="metrics"></pre><button id="pause" type="button"></button></section>
<section><h2>素材撤回</h2><p>撤回後，手機下次連線時移除對應模板及收藏。離線裝置無法立即移除。</p><form id="revoke-form"><label>素材 SHA-256<input id="digest" pattern="[a-f0-9]{64}" required></label><button>撤回素材</button></form></section>
<section><h2>操作紀錄</h2><pre id="audit"></pre></section></div></main><script type="module" src="app.js"></script></body></html>
